<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8"/>
	<title>반응형웹</title>
	<link href="mobile.css" type="text/less" rel="stylesheet" media="screen and (min-width:620px) and (max-width:960px)" />
	<link href="desktop.css" type="text/less" rel="stylesheet" media="screen and (min-width:1600px)" />


<style>	

	div {
		text-align: center;
	}

	img {
		max-width: auto;  /*배치될 이미지 사이즈 정의, 유연한 이미지 표현은  max-width: auto;  로 바꾸면 됨*/			
		height: 300px;
		margin: 0px auto;
	}


	li {
		list-style: none;  /* li목록 앞에 점 없애기*/
		display: inline;
	}

	p {
		font-size: 14px;
	}

	.wrap{
		width:100%;
		height:100%;
		position:relative;
	} 

	.wrap .box{ 
		width:30%;
		height:30%;
		position:absolute;
		left:50%;
		top:50%;
		margin-left:-150px;
		margin-top:-150px;
	}




	/*class 스타일*/ 
	.parent {			
		display: flex;
	}

	.child {
		display: flex;
		padding-right: 20px;
	}

	.child img {			/*이미지 오버시 확대 효과 주기, 이미지가 확대되지만 전체 크기는 변하지 않게*/
		transition: all 0.2s linear;
	}

	.child:hover img {			/*이미지 오버시 확대 효과: 부드럽게 주기 위함*/
		transform: scale(1.2);	 /*숫자가 클수록 이미지 크기가 커짐*/
	}	

</style>




</head>
<body>
	<!-- 이미지 그룹-->



<div class="parent">
	<li>
		<div class="child">
			<img src="img/p002.jpg" class="clicks"><br>
			<p id="p001">이미지 안에 있는 글 내용</p>
		</div>
	</li>
	<li>
		<div class="child">
			<img src="img/p003.jpg" class="clicks"><br>
			<p id="p001">이미지 안에 있는 글 내용</p>
		</div>
	</li>
	<li>
		<div class="child">
			<img src="img/p003.jpg" class="clicks"><br>
			<p id="p001">이미지 안에 있는 글 내용</p>
		</div>
	</li>
</div>


	<div class="parent">	
		<div class="child">
			<img src="img/p004.jpg" class="clicks">
			<p id="p001">이미지 안에 있는 글 내용</p>
		</div>
		<div class="child">
			<img src="img/p005.jpg" class="clicks">
			<p id="p001">이미지 안에 있는 글 내용</p>
		</div>
		<div class="child">
			<img src="img/p006.jpg" class="clicks">
			<p id="p001">이미지 안에 있는 글 내용</p>
		</div>

	</div>	

</body>



<!-- 이미지 클릭시 원본 이미지 새창으로 열기, 클래스명 Clicks 정의 -->
<script type="text/javascript">   
	var img = document.getElementsByClassName('clicks');
		for (var x=0; x<img.length; x++) {
			img.item(x).onclick=function() {window.open(this.src)};				
		}
</script>



</html>
